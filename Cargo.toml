[package]
name = "quando"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Natural-language date parser for English: every date in a sentence, or a todo line as title, date, repeats and markers, with spans."
repository = "https://github.com/Reuzehagel/quando"

[dependencies]

[dev-dependencies]
serde_json = "1.0.154"

[lib]
crate-type = ["rlib", "cdylib"]

[profile.release]
lto = true
opt-level = "s"
